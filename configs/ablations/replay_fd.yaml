experiment:
  name: "HACOD-YOLOv8l"

  seed: 42

  task_order:
    - InsPLAD
    - CPLID
    - MPID
    - STN_PLAD


model:
  architecture: "YOLOv8l"
  pretrained: "yolov8l.pt"

  image_size: 640


training:

  batch_size: 16

  learning_rate:
    task1: 0.01
    incremental: 0.005

  epochs:
    task1: 30
    task2: 30
    task3: 30
    task4: 50

  freeze_layers:
    task1: 0
    task2: 2
    task3: 2
    task4: 2

  amp: false

  augmentation:
    mosaic: 0.0
    mixup: 0.0
    copy_paste: 0.0


replay:

  memory_budget: 500

  class_balanced: true

  selection:
    alpha: 0.4
    beta: 0.2
    gamma: 0.2
    delta: 0.2


loss:

  feature_distillation:
    enabled: true
    weight: 0.2

  relation_preservation:
    enabled: false
    weight: 0.5

  semantic_hierarchy:
    enabled: false